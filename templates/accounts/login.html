{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Sign In - RepoLens{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 border-secondary shadow-lg">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-compass-fill fs-1 text-gradient-primary"></i>
                    <h2 class="mt-3 font-weight-bold text-white">Sign In</h2>
                    <p class="text-muted">Enter your credentials to access RepoLens</p>
                </div>
                
                <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    {% bootstrap_form form show_label=True %}
                    
                    <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 rounded-pill mt-3">
                        Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="text-decoration-none ms-1 text-gradient-cyan fw-bold">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
