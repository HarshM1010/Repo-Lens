{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Create Account - RepoLens{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 border-secondary shadow-lg">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1 text-gradient-cyan"></i>
                    <h2 class="mt-3 font-weight-bold text-white">Create Account</h2>
                    <p class="text-muted">Analyze your repositories asynchronously</p>
                </div>
                
                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}
                    {% bootstrap_form form show_label=True %}
                    
                    <button type="submit" class="btn btn-cyan-gradient w-100 py-2.5 rounded-pill mt-3">
                        Register <i class="bi bi-check-circle ms-2"></i>
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span>
                    <a href="{% url 'login' %}" class="text-decoration-none ms-1 text-gradient-primary fw-bold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
